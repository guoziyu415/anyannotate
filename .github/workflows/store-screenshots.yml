name: Capture Chrome store screenshots

on:
  workflow_dispatch:
    inputs:
      live_recording:
        description: Test the store build on a live public page and record local saving (not Google OAuth)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chrome-extension/package-lock.json
      - run: npm ci
        working-directory: chrome-extension
      - run: npx playwright install --with-deps chromium
        working-directory: chrome-extension
      - run: node tests/e2e/run.mjs --store-screenshots
        if: ${{ !inputs.live_recording }}
        working-directory: chrome-extension
      - name: Prepare isolated store build
        if: ${{ inputs.live_recording }}
        run: |
          node scripts/package-chrome-store.mjs
          mkdir -p "$RUNNER_TEMP/anyannotate-store-test"
          unzip -q dist/AnyAnnotate-Chrome-Web-Store-*.zip -d "$RUNNER_TEMP/anyannotate-store-test"
      - name: Record and verify real local saving
        if: ${{ inputs.live_recording }}
        run: |
          ANYANNOTATE_EXTENSION_PATH="$RUNNER_TEMP/anyannotate-store-test" \
          ANYANNOTATE_EXPECTED_ID="mkdeklipbgfjoibioofimhcklfikgmgo" \
          node tests/e2e/run.mjs --record-live
        working-directory: chrome-extension
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.live_recording }}
        with:
          name: chrome-store-screenshots
          path: build/chrome-store-screenshots/chrome-*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.live_recording }}
        with:
          name: chrome-live-qa
          path: build/chrome-live-qa/
          if-no-files-found: error
